[pytest]
testpaths = tests
python_files = test_*.py bench_*.py
python_classes = Test*
python_functions = test_*
markers =
    auth: authentication and role enforcement tests
    scoreboard: scoreboard and score history tests
    details: IOC details endpoint tests
    iocs: IOC definitions endpoint tests
    teams: teams endpoint tests
    admin_users: admin user management tests
    admin_competition: competition state machine tests
    ioc_definitions: IOC Python class definition validation tests (no VMs required)
    ioc_scripts: IOC script structural validation tests (no VMs required)
    nxc_wrapper: NXCWrapper unit tests (no VMs or nxc binary required)
    check_runner: NXC check runner unit tests (no VMs or nxc binary required)
    deploy_manager: DeployManager batch unit tests (no VMs or nxc binary required)
    c2_boxes: GET /c2/boxes endpoint tests
    c2_creds: /c2/creds CRUD endpoint tests
    c2_exec: POST /c2/exec and /c2/put-file endpoint tests
    c2_events: GET /c2/events SSE endpoint tests
    c2_sessions: /c2/sessions endpoint tests (mock Sliver)
    c2_beacons: /c2/beacons endpoint tests (mock Sliver)
    c2_implants: /c2/implants endpoint tests (mock Sliver)
    c2_pivot_sessions: GET /c2/pivot-sessions endpoint tests
    c2_nxc_health: GET /c2/nxc-health endpoint tests
    nxc_health: NXCHealthTracker unit tests (no backend required)
    c2_dev_mode: DEV_MODE stub endpoint tests (no Sliver or NXC required)
    c2_websocket: WebSocket shell endpoint tests
    sliver_manager: SliverManager unit tests
    batch_protocol: batch_protocol.split_sections() unit tests (no VMs or backend required)
    sa_collector: SA collector unit tests (no VMs or backend required)
    sa_collector_sliver: Sliver SA collector unit tests (no VMs or backend required)
    nmap_scanner: nmap scanner unit tests (no VMs or nmap binary required)
    sa_nmap_pipeline: SA + nmap full pipeline integration tests (no VMs or live backend required)
    beacon_watcher: beacon watcher unit tests (no VMs or backend required)
    c2_sa: /c2/sa endpoint tests
    modules: /c2/modules endpoint tests (module management)
    module_scanner: module scanner unit tests (no VMs or backend required)
    deploy_paths: deploy path rotation unit tests (no VMs or backend required)
    unit: general-purpose unit tests (no VMs, no backend, no network required)
    db_init: DatabaseInitializer unit tests (in-memory SQLite)
    scoring: split-scoring view and CheckResultMessage unit tests (in-memory SQLite)
    c2_module_source: /c2/modules/{id}/source endpoint tests (no VMs or backend required)
    auto_registration: SliverCheck IOC auto-registration and intentional kill tracking tests (no VMs or live Sliver required)
    c2_generate: generate route 422 guard + eager registration unit tests (no VMs, no backend, no Sliver required)
    percentage_scoring: percentage scoring views and scoreboard API tests (in-memory SQLite)
    so_implant: FreeBSD/Linux .so shared-lib implant proto fields + deploy branch + binary-type tests (no VMs, no backend)
    so_implant_live: FreeBSD/Linux .so shared-lib implant deploy lifecycle (requires live VMs + Sliver)
    playbook: playbook loader and scheduler unit tests (no backend, no VMs required)
    c2_kill: kill session/beacon improvement tests (no VMs or live Sliver required)
    c2_exec_tasks: exec task history tests (no VMs or live Sliver required)
    c2_scheduled: scheduled task tests (no VMs or live Sliver required)
    c2_sliver_shell: Sliver shell dispatch and WS endpoint tests (no live Sliver required)
    c2_sliver_console: Sliver console PTY handler unit tests (no backend, no network required)
    live_sliver_console: Live sliver-client console integration tests (requires sliver-client binary + running Sliver server)
    c2_sliver_hub: SliverHub fan-out hub unit tests (no backend, no network required)
    c2_shell_live: Live shell integration tests (requires backend + active Sliver sessions per OS)
    pty_session_shell_live: Live PTY session-shell tests (PLAN_pty_session_shell.md §7.2)
    admin_settings: /admin/settings endpoint tests
    scripts: /scripts/{path} endpoint tests
    sliver_integration: Live Sliver C2 integration tests (requires backend + active Sliver gRPC connection)
    integration: tests requiring live VMs (192.168.1.239)
    e2e: Playwright browser tests (Phase 2)
    slow: tests expected to take >30s
    perf: performance benchmarks (slow — run explicitly, excluded from CI)
    live_perf: live-host performance benchmarks (requires tests/perf/perf_config.yml with real host credentials)
    ioc_integration: IOC effect+persistence integration tests (requires live VMs for all 3 OS types)
    sliver_ioc_e2e: Full Sliver implant IOC lifecycle tests (requires live Sliver + all 3 OS VMs)
    ioc_deploy: /c2/iocs/deploy endpoint tests (requires backend)
    pivot: end-to-end TCP pivot firewall bypass tests (requires team 1 VMs + live Sliver)
    cred_harvester_live: SAM/LSA dump + DCSync + golden ticket e2e (requires live DC + member box)
    live: Live VM e2e tests for Phase 1/2/3 unified script wrapper + bulk exec + timestomp (requires bound team inventory)
    soak: endurance/soak tests (hours-long — requires tests/perf/soak_config.yml and a running server)
    compat: distro compatibility tests (requires RUN_COMPAT=1 + live compat VMs at config/test_distro_inventory.yml)
    competition_restart: backend process crash+restart resumes competition status (docs/PLAN_competition_status_restart.md; requires backend, no VMs needed)
    order: explicit test execution order within a file
    script_kind: SCRIPT-kind (NXC-only) matrix IOC — routed to the wider script_team_* xdist pool
# NOTE: reruns are NOT global — they are applied per-item to live/integration
# tests only (see conftest._RERUN_MARKERS + pytest_collection_modifyitems), so a
# failing unit test fails fast instead of paying a 2× + 5s jitter backstop it
# doesn't need.
# --timeout is a hung-test backstop, NOT a per-test budget.  900s sits above the
# slowest legitimate live test (pivot setup + persistence-retrigger poll chains
# run ~10 min).  Method MUST be 'signal' (raises a catchable Timeout in the main
# thread → clean test failure, worker survives): the 'thread' method calls
# os._exit() on the worker, which under xdist orphans the worker as a zombie and
# wedges the master (observed 2026-06-28 — the 3 slowest live workers died, the
# master futex-hung, run_tests.py blocked on the gateway pipe → whole run stuck).
# The run_tests.sh 30-min idle watchdog is the ultimate backstop for the rare
# C-level hang that SIGALRM can't interrupt.
addopts = -ra --order-group-scope=module --timeout=900 --timeout-method=signal
asyncio_mode = auto
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s.%(msecs)03d [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
