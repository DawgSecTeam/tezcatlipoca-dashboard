# C2 network identity for THIS inventory. Applied to the backend config at
# load time (fastapi_backend/core/inventory_manager.apply_c2_settings) so
# switching inventories carries these three values with it — no more hand-
# editing SCRIPT_SERVER_URL / SLIVER_HOST / C2_IP in .env when toggling files.
# Precedence: an explicit env/.env value for any of these keys still wins;
# leave them out of .env to let the inventory drive them.
c2_settings:
  script_server_url: https://192.168.1.161:4000
  sliver_host: 192.168.1.161
  c2_ip: 192.168.1.161

# Red scoring account (red_scoring) — the ONLY credential the IOC pipeline
# (check/deploy/remediate) authenticates with. Operators never see it. Must be a
# root/Administrator-equivalent account on EVERY box (Windows: Administrators;
# Linux: sudoers; pfSense: admin). Seeded per-box on startup as an
# is_infrastructure=True credential. The PASSWORD is read from
# RED_SCORING_PASSWORD in .env (never stored here); username/domain below
# override the .env defaults. enabled:false (or RED_SCORING_ENABLED=false in
# .env) reverts the IOC pipeline to legacy operator-cred selection.
scoring_account:
  username: red_scoring
  domain: ""
  enabled: true

teams:
# 10 teams × 5 boxes (1 firewall + 2 Windows + 2 Linux) = 50 boxes
# IPs: each team occupies a block of 5 starting at .200 (fw, win1, win2, lin1, lin2)
- name: Blue Team 1
  team_num: 1
  boxes:
  - { ip: 192.168.1.200, name: c3-fw-1,        os: firewall, username: admin,            password: pfsense,     port: 22 }
  - { ip: 192.168.1.201, name: c3-win25-1-1,   os: windows,  username: .\Administrator,  password: "Password1!", domain_username: "TEAM1\\Administrator", domain_password: "Password1!", port: 5985 }
  - { ip: 192.168.1.202, name: c3-win25-1-2,   os: windows,  username: .\Administrator,  password: "Password1!", domain_username: "TEAM1\\Administrator", domain_password: "Password1!", port: 5985 }
  - { ip: 192.168.1.203, name: c3-ubuntu-1-1,  os: linux,    username: root,             password: password,    port: 22 }
  - { ip: 192.168.1.204, name: c3-ubuntu-1-2,  os: linux,    username: root,             password: password,    port: 22 }

