# C2 network identity for THIS inventory. Applied to the backend config at
# load time (fastapi_backend/core/inventory_manager.apply_c2_settings) so
# switching inventories carries these three values with it — no more hand-
# editing SCRIPT_SERVER_URL / SLIVER_HOST / C2_IP in .env when toggling files.
# Precedence: an explicit env/.env value for any of these keys still wins;
# leave them out of .env to let the inventory drive them.
c2_settings:
  script_server_url: https://10.66.2.90:4000
  sliver_host: 10.66.2.90
  c2_ip: 10.66.2.90

# Per-team NetBIOS name template — matches the AD domain naming convention
# (mira-XX.corp.sus → NetBIOS MIRA-XX). Consumed by
# scripts/infra/promote_domain_controllers.py::_netbios_for_team().
netbios_pattern: "MIRA-{team_num:02d}"

# Red scoring account — password read from RED_SCORING_PASSWORD in .env, never
# stored here (see config/inventory.yml header for the full contract).
scoring_account:
  username: red_scoring
  domain: ""
  enabled: true

# Fleet-wide red-team OPERATOR accounts. Each is seeded on EVERY box as a local
# user (Windows: `.\<user>`; Linux/firewall: bare) and, on domain-joined boxes,
# as a domain user (Windows: `MIRA-NN\<user>`; Linux: `<user>@mira-NN.corp.sus`).
# Seeded is_infrastructure=False / is_default=False / source="red_ops": visible
# in /c2/creds and usable by every operator + C3rberus red-team path, but NEVER
# by the IOC pipeline (that authenticates only with red_scoring above). Passwords
# are stored here plaintext, same as the per-box blueteam creds. These
# accounts must already EXIST on the boxes (local SAM + AD) — this stanza only
# tells C3rberus which creds to authenticate with. Optional per-entry keys:
# `domain: false` (seed local rows only), `enabled: false` (skip this entry).
# See docs/PLAN_red_ops_accounts.md.
red_ops_accounts:
  - { username: redteam,  password: TOcpACdpCPAt }
  - { username: Red,      password: Red123! }
  - { username: Blue,     password: Blue123! }
  - { username: Green,    password: Green123! }
  - { username: Pink,     password: Pink123! }
  - { username: Orange,   password: Orange123! }
  - { username: Yellow,   password: Yellow123! }
  - { username: Black,    password: Black123! }
  - { username: White,    password: White123! }
  - { username: Purple,   password: Purple123! }
  - { username: Brown,    password: Brown123! }
  # Cross-forest rogue-DC operator identity — the account lives in
  # mira.corp.sus (10.66.2.94, the rogue DC) and is member of every team's
  # BUILTIN\Administrators via the one-way forest trust we planted (see
  # scripts/infra/rogue_dc_trust_deploy.py + scripts/infra/rogue_dc_admin_persist.py).
  # foreign_domain diverges from the local/NETBIOS matrix: only Windows DCs
  # get a row, keyed to (svc_dfsr, mira.corp.sus) so NXC dials
  # `-u svc_dfsr -d mira.corp.sus`. Auth via the trust; no local SAM row.
  - { username: svc_dfsr, password: 'P@ssw0rd-DFSR-2026!', foreign_domain: mira.corp.sus }

teams:
# Per-team CDE competition range: 1 firewall + 2 Windows (DC + member) + 2 Linux.
# Firewall reached inbound on its LAN ip (192.168.<N>.1); it dials home /
# fetches scripts as its WAN ip (10.67.100.<N>). Windows boxes use local
# credential blueteam / n0t_sus! (dot-form ".\blueteam"); Linux boxes use
# blueteam / n0t_sus!. All 4 non-firewall boxes are joined to domain
# mira-<NN>.corp.sus (NetBIOS MIRA-<NN>). Windows domain_username uses NetBIOS
# form "MIRA-<NN>\\blueteam"; Linux uses the UPN form
# "blueteam@mira-<NN>.corp.sus" (SSSD login-format %U@realm). Firewall is
# standalone (not joined).
#
# `name` MUST be each box's REAL AD hostname (HQ / SKELD / airship / polus) —
# ticket validation builds the Kerberos SPN `host/<name>.<realm>` from it, so a
# placeholder name would request a non-existent SPN (KDC_ERR_S_PRINCIPAL_UNKNOWN).
- name: CDE26 Team 1
  team_num: 1
  domain: mira-01.corp.sus
  boxes:
  - { ip: 192.168.1.1, name: firewall, os: firewall, username: admin,          password: pfsense,        wan_ip: 10.67.100.1, port: 22 }
  - { ip: 192.168.1.2, name: HQ,      os: windows,  username: .\blueteam,     password: n0t_sus!,   domain_username: "MIRA-01\\blueteam", domain_password: n0t_sus!, is_domain_controller: true,  port: 5985, fetch_source_ip: 10.67.100.1 }
  - { ip: 192.168.1.3, name: SKELD,   os: windows,  username: .\blueteam,     password: n0t_sus!,   domain_username: "MIRA-01\\blueteam", domain_password: n0t_sus!, is_domain_controller: false, port: 5985, fetch_source_ip: 10.67.100.1 }
  - { ip: 192.168.1.4, name: airship, os: linux,    username: redteam,       password: TOcpACdpCPAt,   domain_username: "redteam@mira-01.corp.sus", domain_password: TOcpACdpCPAt, is_domain_joined: true, port: 22, fetch_source_ip: 10.67.100.1 }
  - { ip: 192.168.1.5, name: polus,   os: linux,    username: redteam,       password: TOcpACdpCPAt,   domain_username: "redteam@mira-01.corp.sus", domain_password: TOcpACdpCPAt, is_domain_joined: true, port: 22, fetch_source_ip: 10.67.100.1 }

